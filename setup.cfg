[metadata]
name = isynctab
version = 0.1.0
author = Al Zadid Sultan Bin Habib, Md Younus Ahamed, Prashnna Kumar Gyawali, Gianfranco Doretto, Donald A. Adjeroh
description = Learning Cross-Modal Feature Sequencing for Multimodal Data via Neural Synchrony
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/zadid6pretam/iSyncTab

project_urls =
    Paper = https://doi.org/10.1007/978-3-032-37035-8
    Conference = https://eccv.ecva.net
    Homepage = https://www.zadidhabib.com/isynctab.html
    Source = https://github.com/zadid6pretam/iSyncTab
    Issues = https://github.com/zadid6pretam/iSyncTab/issues

classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Image Processing
    Topic :: Scientific/Engineering :: Information Analysis

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24
    pandas>=2.0
    torch>=2.2
    torchvision>=0.17
    scipy>=1.11
    Pillow>=10.0
    linformer>=0.2
    optuna>=3.6
    matplotlib>=3.7
    torchaudio>=2.2
    scikit-learn>=1.3
    opencv-python>=4.8
    tqdm>=4.66
include_package_data = True

[options.packages.find]
include =
    isynctab
    isynctab.*
