[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isynctab"
version = "0.1.0"
description = "iSyncTab: Learning Cross-Modal Feature Sequencing for Multimodal Data via Neural Synchrony"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "Al Zadid Sultan Bin Habib" },
  { name = "Md Younus Ahamed" },
  { name = "Prashnna Kumar Gyawali" },
  { name = "Gianfranco Doretto" },
  { name = "Donald A. Adjeroh" }
]

keywords = [
  "multimodal-learning",
  "image-tabular-learning",
  "audio-video-learning",
  "feature-sequencing",
  "cross-modal-learning",
  "column-permutation",
  "neural-synchrony",
  "NeuroAI",
  "NS-PFS",
  "OMT",
  "transformer",
  "linformer",
  "memory-tokens"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "scipy>=1.11",
  "Pillow>=10.0",
  "linformer>=0.2",
  "optuna>=3.6",
  "matplotlib>=3.7",
  "torchaudio>=2.2",
  "scikit-learn>=1.3",
  "opencv-python>=4.8",
  "tqdm>=4.66",
]

[project.urls]
Homepage = "https://www.zadidhabib.com/isynctab.html"
Source = "https://github.com/zadid6pretam/iSyncTab"
Issues = "https://github.com/zadid6pretam/iSyncTab/issues"
Paper = "https://doi.org/10.1007/978-3-032-37035-8"
Conference = "https://eccv.ecva.net"

[tool.setuptools.packages.find]
where = ["."]
include = ["isynctab*"]
